name: OpenClaw 16GB Direct Engine
on:
  push:
  workflow_dispatch:
concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run-16gb-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Boot & Install
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          T=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]'); U=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')
          curl -s -X POST "https://telegram.org{T}/sendMessage" --data-urlencode "chat_id=${U}" --data-urlencode "text=⏳ Direct AI Engine Booting... (35s)" >/dev/null || true
          sudo apt-get update -y && sudo apt-get install -y ffmpeg jq curl
          sudo npm config set ignore-scripts false && sudo npm install -g --foreground-scripts openclaw@latest
          pip install --break-system-packages -q auto-editor yt-dlp requests
      - name: Direct Multi-AI Setup & Run 24/7
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p "$HOME/.openclaw/agents/main/agent" workspace/input workspace/output backup_workspace
          cp -rn backup_workspace/* workspace/ 2>/dev/null || true
          T=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]'); U=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')
          GK=$(echo -n "$GROQ_KEY" | tr -d '[:space:]'); OK=$(echo -n "$OPENROUTER_KEY" | tr -d '[:space:]'); GM=$(echo -n "$GEMINI_KEY" | tr -d '[:space:]')
          TOK=$(openssl rand -hex 16)
          printf '#!/usr/bin/env bash\nset -e\nP=$(echo "$1"|tr "[:upper:]" "[:lower:]"); K=$(echo -n "$2"|tr -d "[:space:]"); [[ "$P" == "gemini" ]] && P="google"\nID="${P}:extra_$(date +%%s)"\njq --arg id "$ID" --arg p "$P" --arg k "$K" ".profiles[\$id]={type:\"api_key\",provider:\$p,key:\$k}" "$HOME/.openclaw/agents/main/agent/auth-profiles.json" > /tmp/ap.json && mv /tmp/ap.json "$HOME/.openclaw/agents/main/agent/auth-profiles.json"\nopenclaw doctor --fix >/dev/null 2>&1 || true\necho "SUCCESS: $P key added!"\n' > workspace/manage_api.sh && chmod +x workspace/manage_api.sh
          printf '# 16GB Direct AI Engine\n- Hinglish mein concise, helpful reply karo.\n- `/api` COMMAND: Jab user `/api` bheje, poochho "Google Gemini ya OpenRouter? Provider aur key bhej dein." Key milte hi `bash workspace/manage_api.sh <provider> <key>` chalao.\n- VIDEO AUTO-DELETE: Video `workspace/input/` mein save karo, `ffmpeg`/`auto-editor` se `workspace/output/` mein render karke bhejo, aur "Done ✅" se pehle `rm -rf workspace/input/* workspace/output/*` chalao.\n' > workspace/SOUL.md
          jq -n --arg gk "$GK" --arg ok "$OK" --arg gm "$GM" '{version:1,profiles:{"groq:default":{type:"api_key",provider:"groq",key:$gk},"openrouter:default":{type:"api_key",provider:"openrouter",key:$ok},"google:default":{type:"api_key",provider:"google",key:$gm}}}' > "$HOME/.openclaw/agents/main/agent/auth-profiles.json"
          jq -n --arg tok "$TOK" --arg ws "$PWD/workspace" --arg t "$T" --arg u "$U" --arg o "telegram:${U}" --arg gk "$GK" --arg ok "$OK" --arg gm "$GM" '{gateway:{mode:"local",port:18789,bind:"loopback",auth:{mode:"token",token:$tok}},auth:{profiles:{"groq:default":{provider:"groq",mode:"api_key"},"openrouter:default":{provider:"openrouter",mode:"api_key"},"google:default":{provider:"google",mode:"api_key"}}},commands:{ownerAllowFrom:[$o]},memory:{search:{provider:"none"}},models:{providers:{groq:{baseUrl:"https://groq.com",apiKey:$gk,api:"openai-completions",models:[{id:"llama-3.3-70b-versatile",name:"Groq Llama 70B",reasoning:false,input:["text"],cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:131072,maxTokens:4096}]},openrouter:{baseUrl:"https://openrouter.ai",apiKey:$ok,api:"openai-completions",models:[{id:"openrouter/free",name:"OpenRouter Free",reasoning:false,input:["text"],cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:131072,maxTokens:4096}]},google:{baseUrl:"https://googleapis.com",apiKey:$gm,api:"openai-completions",models:[{id:"gemini-2.5-flash",name:"Gemini 2.5 Flash",reasoning:false,input:["text"],cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:131072,maxTokens:4096}]}}},agents:{defaults:{workspace:$ws,maxConcurrent:2,timeoutSeconds:120,model:{primary:"groq/llama-3.3-70b-versatile",fallbacks:["openrouter/openrouter/free","google/gemini-2.5-flash"]}}},tools:{exec:{security:"full",ask:"off",timeoutSec:90}},channels:{telegram:{enabled:true,botToken:$t,dmPolicy:"allowlist",allowFrom:[$u]}}}' > "$HOME/.openclaw/openclaw.json"
          openclaw doctor --fix >/dev/null 2>&1 || true
          chmod 700 "$HOME/.openclaw" && chmod 600 "$HOME/.openclaw/openclaw.json"
          curl -s -X POST "https://telegram.org{T}/sendMessage" --data-urlencode "chat_id=${U}" --data-urlencode "text=✅ Direct AI Server LIVE (Groq + OpenRouter + Gemini)! Ab '/new' karke 'Hi' bhejein!" >/dev/null || true
          ST=$(date +%s)
          timeout 19500s openclaw gateway run --port 18789 --verbose 2>&1 | tee /tmp/openclaw.log || true
          rm -rf workspace/input/* workspace/output/* FULL_DIAGNOSTIC_REPORT.txt 2>/dev/null || true
          cp -r workspace/* backup_workspace/ 2>/dev/null || true
          git config user.name "Bot" && git config user.email "b@o.local"
          git remote set-url origin "https://x-access-token:${GH_PAT}@://github.com{{ github.repository }}.git"
          git add -A && git diff --staged --quiet || (git commit -m "Sync" && git push)
          if [ $(( $(date +%s) - ST )) -ge 300 ]; then
            curl -s -X POST "https://github.com{{ github.repository }}/actions/workflows/openclaw_16gb.yml/dispatches" -H "Authorization: Bearer ${GH_PAT}" -d '{"ref":"main"}' || true
          fi
