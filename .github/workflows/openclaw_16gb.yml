name: OpenClaw Full Error Collector

on:
  push:
  workflow_dispatch:

concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect-all-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Complete System Check & Save Everything to File
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          REPORT="FULL_DIAGNOSTIC_REPORT.txt"
          echo "=== OPENCLAW FULL PROJECT DIAGNOSTIC REPORT ===" > "$REPORT"
          echo "Time: $(date -u)" >> "$REPORT"

          echo -e "\n--- 1. SYSTEM & TOOLS INSTALL ---" >> "$REPORT"
          sudo apt-get update -y >> "$REPORT" 2>&1 || true
          sudo apt-get install -y ffmpeg jq curl python3-pip >> "$REPORT" 2>&1 || true
          sudo npm config set ignore-scripts false >> "$REPORT" 2>&1 || true
          sudo npm install -g --foreground-scripts openclaw@latest >> "$REPORT" 2>&1 || true
          pip install --break-system-packages -q 'litellm[proxy]' auto-editor yt-dlp >> "$REPORT" 2>&1 || true

          echo -e "\n--- 2. VERSIONS ---" >> "$REPORT"
          echo "Node: $(node -v 2>&1)" >> "$REPORT"
          echo "OpenClaw: $(openclaw --version 2>&1)" >> "$REPORT"
          echo "LiteLLM: $(litellm --version 2>&1)" >> "$REPORT"

          echo -e "\n--- 3. REPO FILES ---" >> "$REPORT"
          ls -la >> "$REPORT" 2>&1
          ls -la backup_workspace >> "$REPORT" 2>&1 || true

          echo -e "\n--- 4. SECRETS & API KEY TEST ---" >> "$REPORT"
          CLEAN_GEM=$(echo -n "$GEMINI_KEY" | tr -d '[:space:]')
          CLEAN_OR=$(echo -n "$OPENROUTER_KEY" | tr -d '[:space:]')
          CLEAN_GROQ=$(echo -n "$GROQ_KEY" | tr -d '[:space:]')
          CLEAN_TG=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]')
          CLEAN_UID=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')

          echo "GEMINI_KEY len: ${#CLEAN_GEM}" >> "$REPORT"
          echo "OPENROUTER_KEY len: ${#CLEAN_OR}" >> "$REPORT"
          echo "GROQ_KEY len: ${#CLEAN_GROQ}" >> "$REPORT"
          echo "TG_BOT_TOKEN len: ${#CLEAN_TG}" >> "$REPORT"
          echo "TG_USER_ID: ${CLEAN_UID}" >> "$REPORT"

          echo "Gemini HTTP: $(curl -s -o /tmp/g.txt -w '%{http_code}' "https://googleapis.com{CLEAN_GEM}")" >> "$REPORT"
          cat /tmp/g.txt | head -c 300 >> "$REPORT"
          echo -e "\nOpenRouter HTTP: $(curl -s -o /tmp/o.txt -w '%{http_code}' https://openrouter.ai -H "Authorization: Bearer ${CLEAN_OR}")" >> "$REPORT"
          cat /tmp/o.txt | head -c 300 >> "$REPORT"
          echo -e "\nGroq HTTP: $(curl -s -o /tmp/q.txt -w '%{http_code}' https://groq.com -H "Authorization: Bearer ${CLEAN_GROQ}")" >> "$REPORT"

          echo -e "\n--- 5. LITELLM PROXY TEST ---" >> "$REPORT"
          cat << EOF > /tmp/litellm_test.json
          {
            "model_list": [
              {"model_name": "smart-free-pool", "litellm_params": {"model": "gemini/gemini-2.5-flash", "api_key": "${CLEAN_GEM}"}},
              {"model_name": "smart-free-pool", "litellm_params": {"model": "openrouter/openrouter/free", "api_key": "${CLEAN_OR}"}}
            ]
          }
          EOF
          nohup litellm --config /tmp/litellm_test.json --port 4000 --host 127.0.0.1 >/tmp/litellm.log 2>&1 &
          sleep 6
          echo "LiteLLM Health: $(curl -s -o /tmp/lh.txt -w '%{http_code}' http://127.0.0 -H 'Authorization: Bearer sk-test')" >> "$REPORT"
          cat /tmp/litellm.log | tail -n 30 >> "$REPORT"

          echo -e "\n--- 6. OPENCLAW CONFIG & GATEWAY CRASH LOG ---" >> "$REPORT"
          AGENT_DIR="$HOME/.openclaw/agents/main/agent"
          mkdir -p "$AGENT_DIR" workspace
          TOK=$(openssl rand -hex 16)
          jq -n '{version:1,profiles:{"litellm:default":{type:"api_key",provider:"litellm",key:"sk-test"}}}' > "$AGENT_DIR/auth-profiles.json"
          jq -n --arg tok "$TOK" --arg ws "$PWD/workspace" --arg tg_t "$CLEAN_TG" --arg tg_u "$CLEAN_UID" \
            '{
              gateway:{mode:"local",port:18789,bind:"loopback",auth:{mode:"token",token:$tok}},
              auth:{profiles:{"litellm:default":{provider:"litellm",mode:"api_key"}}},
              models:{providers:{litellm:{baseUrl:"http://127.0.0",apiKey:"sk-test",api:"openai-completions",models:[{id:"smart-free-pool",name:"Pool",reasoning:false,input:["text"],cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:16384,maxTokens:2048}]}}},
              agents:{defaults:{workspace:$ws,model:{primary:"litellm/smart-free-pool"}}},
              channels:{telegram:{enabled:true,botToken:$tg_t,dmPolicy:"allowlist",allowFrom:[$tg_u]}}
            }' > "$HOME/.openclaw/openclaw.json"

          openclaw doctor >> "$REPORT" 2>&1 || true
          echo -e "\n--- 7. LIVE GATEWAY OUTPUT ---" >> "$REPORT"
          timeout 15s openclaw gateway run --port 18789 --verbose >> "$REPORT" 2>&1 || true

          # Send Document + Summary to Telegram
          TG_API=$(echo "aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==" | base64 -d)
          curl -s -F "chat_id=${CLEAN_UID}" -F "document=@${REPORT}" -F "caption=📄 Poora Diagnostic Report File taiyar hai! Ise copy karke bhej dein." "${TG_API}${CLEAN_TG}/sendDocument" >/dev/null || true

      - name: Commit Report File to GitHub Repo
        if: always()
        run: |
          git config user.name "OpenClawDiag"
          git config user.email "diag@openclaw.local"
          git add FULL_DIAGNOSTIC_REPORT.txt
          git commit -m "Add full diagnostic report" || true
          git push || true
