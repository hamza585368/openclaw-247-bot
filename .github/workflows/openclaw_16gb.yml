name: OpenClaw 16GB Engine

on:
  push:
    paths:
      - '.github/workflows/openclaw_16gb.yml'
  workflow_dispatch:

concurrency:
  group: openclaw-single-instance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-16gb-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Node 26 & Video Tools (16GB RAM)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg sox libsox-fmt-all jq curl
          sudo npm install -g n
          sudo n 26
          export PATH="/usr/local/bin:$PATH"
          sudo npm config set ignore-scripts false
          sudo npm install -g --foreground-scripts openclaw@latest
          pip install -q auto-editor openai-whisper yt-dlp moviepy opencv-python-headless rembg onnxruntime scenedetect

      - name: Create Config Using Pure jq (Zero Indentation Error)
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          mkdir -p ~/.openclaw workspace/input workspace/output
          cp -rn backup_workspace/* workspace/ 2>/dev/null || true
          echo "# 16GB RAM GitHub Cloud AI Video Editor - Hinglish mein reply karo aur ffmpeg (-y -nostdin -crf 18), auto-editor, whisper, yt-dlp se high quality edit karo." > workspace/SOUL.md
          GQ_U=$(echo "aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3Yx" | base64 -d)
          GM_U=$(echo "aHR0cHM6Ly9nZW5lcmF0aXZlbGFuZ3VhZ2UuZ29vZ2xlYXBpcy5jb20vdjFiZXRhL29wZW5haS8=" | base64 -d)
          OR_U=$(echo "aHR0cHM6Ly9vcGVucm91dGVyLmFpL2FwaS92MQ==" | base64 -d)
          TOK=$(openssl rand -hex 16)
          jq -n \
            --arg tok "$TOK" \
            --arg ws "$PWD/workspace" \
            --arg gq_u "$GQ_U" --arg gq_k "$GROQ_KEY" \
            --arg gm_u "$GM_U" --arg gm_k "$GEMINI_KEY" \
            --arg or_u "$OR_U" --arg or_k "$OPENROUTER_KEY" \
            --arg tg_t "$TG_BOT_TOKEN" --arg tg_u "$TG_USER_ID" \
            '{
              gateway: {mode: "local", port: 18789, bind: "loopback", auth: {mode: "token", token: $tok}},
              models: {providers: {
                groq_fast: {baseUrl: $gq_u, apiKey: $gq_k, api: "openai-completions", models: [
                  {id: "llama-3.3-70b-versatile", name: "Groq 70B", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 128000, maxTokens: 8192}
                ]},
                gemini_direct: {baseUrl: $gm_u, apiKey: $gm_k, api: "openai-completions", models: [
                  {id: "gemini-2.5-flash", name: "Gemini Flash", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 1000000, maxTokens: 8192}
                ]},
                openrouter: {baseUrl: $or_u, apiKey: $or_k, api: "openai-completions", models: [
                  {id: "openrouter/free", name: "OR Free", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 128000, maxTokens: 8192}
                ]}
              }},
              agents: {defaults: {workspace: $ws, model: {primary: "groq_fast/llama-3.3-70b-versatile", fallbacks: ["gemini_direct/gemini-2.5-flash", "openrouter/openrouter/free"]}}},
              tools: {exec: {security: "full", ask: "off"}},
              channels: {telegram: {enabled: true, botToken: $tg_t, dmPolicy: "allowlist", allowFrom: [$tg_u]}}
            }' > ~/.openclaw/openclaw.json

      - name: Start OpenClaw 16GB Live Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          openclaw --version
          openclaw doctor --fix <<< $'y\ny\n' || true
          timeout 19500s openclaw gateway run --port 18789 --verbose || true

      - name: Auto-Save Workspace Backup
        if: always()
        run: |
          mkdir -p backup_workspace
          cp -r workspace/* backup_workspace/ 2>/dev/null || true
          git config user.name "OpenClaw16GB"
          git config user.email "bot@openclaw.local"
          git add backup_workspace
          git diff --staged --quiet || (git commit -m "Sync 16GB workspace" && git push)
