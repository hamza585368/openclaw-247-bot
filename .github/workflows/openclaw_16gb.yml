name: OpenClaw 16GB Engine

on:
  push:
  workflow_dispatch:

concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-16gb-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Node 26 & 16GB Video Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg sox libsox-fmt-all jq curl
          sudo npm install -g n
          sudo n 26
          export PATH="/usr/local/bin:$PATH"
          sudo npm config set ignore-scripts false
          sudo npm install -g --foreground-scripts openclaw@latest
          pip install -q auto-editor openai-whisper yt-dlp moviepy opencv-python-headless rembg onnxruntime scenedetect

      - name: Hybrid Auth Setup (Works 100% on Latest OpenClaw)
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          AGENT_DIR="$HOME/.openclaw/agents/main/agent"
          mkdir -p "$AGENT_DIR" "$HOME/.openclaw/credentials" workspace/input workspace/output
          cp -rn backup_workspace/* workspace/ 2>/dev/null || true
          echo "# 16GB RAM GitHub Cloud AI Video Editor - Hinglish mein reply karo aur ffmpeg (-y -nostdin -crf 18), auto-editor, whisper, yt-dlp se high quality edit karo." > workspace/SOUL.md

          CLEAN_GROQ=$(echo -n "$GROQ_KEY" | tr -d '[:space:]')
          CLEAN_GEMINI=$(echo -n "$GEMINI_KEY" | tr -d '[:space:]')
          CLEAN_OR=$(echo -n "$OPENROUTER_KEY" | tr -d '[:space:]')
          CLEAN_TG=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]')
          CLEAN_UID=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')

          GQ_U=$(echo "aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3Yx" | base64 -d)
          GM_U=$(echo "aHR0cHM6Ly9nZW5lcmF0aXZlbGFuZ3VhZ2UuZ29vZ2xlYXBpcy5jb20vdjFiZXRhL29wZW5haS8=" | base64 -d)
          OR_U=$(echo "aHR0cHM6Ly9vcGVucm91dGVyLmFpL2FwaS92MQ==" | base64 -d)
          TOK=$(openssl rand -hex 16)

          # 1. Credential Store
          jq -n \
            --arg gq "$CLEAN_GROQ" \
            --arg gm "$CLEAN_GEMINI" \
            --arg or "$CLEAN_OR" \
            '{
              version: 1,
              profiles: {
                "google:default": {type: "api_key", provider: "google", key: $gm},
                "groq:default": {type: "api_key", provider: "groq", key: $gq},
                "openrouter:default": {type: "api_key", provider: "openrouter", key: $or}
              }
            }' > "$AGENT_DIR/auth-profiles.json"

          # 2. Combined Native + Custom Endpoint Config
          jq -n \
            --arg tok "$TOK" \
            --arg ws "$PWD/workspace" \
            --arg gq_u "$GQ_U" --arg gq_k "$CLEAN_GROQ" \
            --arg gm_u "$GM_U" --arg gm_k "$CLEAN_GEMINI" \
            --arg or_u "$OR_U" --arg or_k "$CLEAN_OR" \
            --arg tg_t "$CLEAN_TG" --arg tg_u "$CLEAN_UID" \
            '{
              gateway: {mode: "local", port: 18789, bind: "loopback", auth: {mode: "token", token: $tok}},
              auth: {
                profiles: {
                  "google:default": {provider: "google", mode: "api_key"},
                  "groq:default": {provider: "groq", mode: "api_key"},
                  "openrouter:default": {provider: "openrouter", mode: "api_key"}
                }
              },
              models: {
                providers: {
                  gemini_fast: {baseUrl: $gm_u, apiKey: $gm_k, api: "openai-completions", models: [
                    {id: "gemini-2.5-flash", name: "Gemini 2.5 Flash", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 1000000, maxTokens: 8192}
                  ]},
                  groq_fast: {baseUrl: $gq_u, apiKey: $gq_k, api: "openai-completions", models: [
                    {id: "llama-3.3-70b-versatile", name: "Groq 70B", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 128000, maxTokens: 8192}
                  ]},
                  openrouter: {baseUrl: $or_u, apiKey: $or_k, api: "openai-completions", models: [
                    {id: "openrouter/free", name: "OR Free", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 128000, maxTokens: 8192}
                  ]}
                }
              },
              agents: {
                defaults: {
                  workspace: $ws,
                  model: {
                    primary: "gemini_fast/gemini-2.5-flash",
                    fallbacks: [
                      "google/gemini-2.5-flash",
                      "groq_fast/llama-3.3-70b-versatile",
                      "groq/llama-3.3-70b-versatile",
                      "openrouter/openrouter/free"
                    ]
                  }
                }
              },
              tools: {exec: {security: "full", ask: "off"}},
              channels: {telegram: {enabled: true, botToken: $tg_t, dmPolicy: "allowlist", allowFrom: [$tg_u]}}
            }' > "$HOME/.openclaw/openclaw.json"

      - name: Start OpenClaw 16GB Live Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          TG_API=$(echo "aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==" | base64 -d)
          curl -s -X POST "${TG_API}${TG_BOT_TOKEN}/sendMessage" -d "chat_id=${TG_USER_ID}" -d "text=🚀 Naya Hybrid Server LIVE! Ab '/new' aur 'Hi' bhejein!" >/dev/null || true
          timeout 19500s openclaw gateway run --port 18789 --verbose || true

      - name: Auto-Save Backup & Trigger Next 24/7 Cycle
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p backup_workspace
          cp -r workspace/* backup_workspace/ 2>/dev/null || true
          git config user.name "OpenClaw16GB"
          git config user.email "bot@openclaw.local"
          git add backup_workspace
          git diff --staged --quiet || (git commit -m "Sync 16GB workspace" && git push)
          GH_API=$(echo "aHR0cHM6Ly9hcGkuZ2l0aHViLmNvbS9yZXBvcy8=" | base64 -d)
          curl -s -X POST "${GH_API}${{ github.repository }}/actions/workflows/openclaw_16gb.yml/dispatches" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' || true
