name: OpenClaw 16GB Engine

on:
  push:
    paths:
      - '.github/workflows/openclaw_16gb.yml'
  workflow_dispatch:

concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-16gb-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Safe API Key & Secret Check (No Leak)
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          echo "=== SECRET LENGTH CHECK ==="
          echo "GROQ_KEY length: ${#GROQ_KEY} (Expected ~56)"
          echo "GEMINI_KEY length: ${#GEMINI_KEY} (Expected ~39)"
          echo "OPENROUTER_KEY length: ${#OPENROUTER_KEY} (Expected ~73)"
          echo "TG_BOT_TOKEN length: ${#TG_BOT_TOKEN} (Expected ~46)"

      - name: Install Node 26 & 16GB Video Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg sox libsox-fmt-all jq curl
          sudo npm install -g n
          sudo n 26
          export PATH="/usr/local/bin:$PATH"
          sudo npm config set ignore-scripts false
          sudo npm install -g --foreground-scripts openclaw@latest
          pip install -q auto-editor openai-whisper yt-dlp moviepy opencv-python-headless rembg onnxruntime scenedetect

      - name: Configure Native AI Auth (Groq + Gemini + OpenRouter)
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          mkdir -p ~/.openclaw workspace/input workspace/output
          cp -rn backup_workspace/* workspace/ 2>/dev/null || true
          echo "# 16GB RAM GitHub Cloud AI Video Editor - Hinglish mein reply karo aur ffmpeg (-y -nostdin -crf 18), auto-editor, whisper, yt-dlp se high quality video edit karo." > workspace/SOUL.md

          CLEAN_GROQ=$(echo -n "$GROQ_KEY" | tr -d '[:space:]')
          CLEAN_GEMINI=$(echo -n "$GEMINI_KEY" | tr -d '[:space:]')
          CLEAN_OR=$(echo -n "$OPENROUTER_KEY" | tr -d '[:space:]')
          CLEAN_TG=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]')
          CLEAN_UID=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')
          TOK=$(openssl rand -hex 16)

          jq -n \
            --arg tok "$TOK" \
            --arg ws "$PWD/workspace" \
            --arg tg_t "$CLEAN_TG" \
            --arg tg_u "$CLEAN_UID" \
            '{
              gateway: {mode: "local", port: 18789, bind: "loopback", auth: {mode: "token", token: $tok}},
              agents: {
                defaults: {
                  workspace: $ws,
                  model: {
                    primary: "groq/llama-3.3-70b-versatile",
                    fallbacks: [
                      "google/gemini-2.5-flash",
                      "openrouter/meta-llama/llama-3.3-70b-instruct:free",
                      "openrouter/openrouter/free"
                    ]
                  }
                }
              },
              tools: {exec: {security: "full", ask: "off"}},
              channels: {telegram: {enabled: true, botToken: $tg_t, dmPolicy: "allowlist", allowFrom: [$tg_u]}}
            }' > ~/.openclaw/openclaw.json

          # Official OpenClaw Auth Store Setup
          openclaw config set env.GROQ_API_KEY "$CLEAN_GROQ" 2>/dev/null || true
          openclaw config set env.GEMINI_API_KEY "$CLEAN_GEMINI" 2>/dev/null || true
          openclaw config set env.OPENROUTER_API_KEY "$CLEAN_OR" 2>/dev/null || true

      - name: Start OpenClaw 16GB Live Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          export GROQ_API_KEY=$(echo -n "$GROQ_API_KEY" | tr -d '[:space:]')
          export GEMINI_API_KEY=$(echo -n "$GEMINI_API_KEY" | tr -d '[:space:]')
          export GOOGLE_API_KEY="$GEMINI_API_KEY"
          export OPENROUTER_API_KEY=$(echo -n "$OPENROUTER_API_KEY" | tr -d '[:space:]')
          openclaw doctor --fix <<< $'y\ny\n' || true
          timeout 19500s openclaw gateway run --port 18789 --verbose || true

      - name: Auto-Save Workspace Backup
        if: always()
        run: |
          mkdir -p backup_workspace
          cp -r workspace/* backup_workspace/ 2>/dev/null || true
          git config user.name "OpenClaw16GB"
          git config user.email "bot@openclaw.local"
          git add backup_workspace
          git diff --staged --quiet || (git commit -m "Sync 16GB workspace" && git push)
