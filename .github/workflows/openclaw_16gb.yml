name: OpenClaw Full Project Diagnostic

on:
  push:
  workflow_dispatch:

concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true

jobs:
  diagnose-everything:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
          sudo npm config set ignore-scripts false
          sudo npm install -g --foreground-scripts openclaw@latest
          pip install -q 'litellm[proxy]'

      - name: Run Full X-Ray & Send Complete Report to Telegram
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          CLEAN_TG=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]')
          CLEAN_UID=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')
          TG_API=$(echo "aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==" | base64 -d)

          send_tg() {
            curl -s -X POST "${TG_API}${CLEAN_TG}/sendMessage" \
              --data-urlencode "chat_id=${CLEAN_UID}" \
              --data-urlencode "text=$1" >/dev/null || true
          }

          # 1. Check Repo Files & Versions
          OC_VER=$(openclaw --version 2>&1 || echo "NO_OPENCLAW")
          LITE_VER=$(litellm --version 2>&1 || echo "NO_LITELLM")
          REPO_FILES=$(ls -la && ls -la backup_workspace 2>/dev/null || echo "no backup_workspace")

          # 2. Check API Keys
          GEM_CODE=$(curl -s -o /tmp/gem.json -w "%{http_code}" "https://googleapis.com(echo -n "$GEMINI_KEY" | tr -d '[:space:]')")
          OR_CODE=$(curl -s -o /tmp/or.json -w "%{http_code}" https://openrouter.ai -H "Authorization: Bearer $(echo -n "$OPENROUTER_KEY" | tr -d '[:space:]')")

          # 3. Test LiteLLM Proxy Startup
          python3 workspace/build_litellm.py > /tmp/build_out.txt 2>&1 || true
          nohup litellm --config /tmp/litellm_config.yaml --port 4000 --host 127.0.0.1 >/tmp/litellm_diag.log 2>&1 &
          sleep 5
          LITE_HEALTH=$(curl -s -o /tmp/lite_test.json -w "%{http_code}" http://127.0.0 -H "Authorization: Bearer sk-local-free-pool" || echo "DOWN")
          LITE_LOG=$(tail -n 20 /tmp/litellm_diag.log 2>/dev/null || echo "no litellm log")

          # 4. Recreate OpenClaw Config & Run Doctor + Gateway Capture
          AGENT_DIR="$HOME/.openclaw/agents/main/agent"
          mkdir -p "$AGENT_DIR" workspace
          TOK=$(openssl rand -hex 16)
          jq -n '{version:1,profiles:{"litellm:default":{type:"api_key",provider:"litellm",key:"sk-local-free-pool"}}}' > "$AGENT_DIR/auth-profiles.json"
          jq -n --arg tok "$TOK" --arg ws "$PWD/workspace" --arg tg_t "$CLEAN_TG" --arg tg_u "$CLEAN_UID" \
            '{
              gateway:{mode:"local",port:18789,bind:"loopback",auth:{mode:"token",token:$tok}},
              auth:{profiles:{"litellm:default":{provider:"litellm",mode:"api_key"}}},
              models:{providers:{litellm:{baseUrl:"http://127.0.0",apiKey:"sk-local-free-pool",api:"openai-completions",models:[{id:"smart-free-pool",name:"Pool",reasoning:false,input:["text"],cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:16384,maxTokens:2048}]}}},
              agents:{defaults:{workspace:$ws,model:{primary:"litellm/smart-free-pool"}}},
              channels:{telegram:{enabled:true,botToken:$tg_t,dmPolicy:"allowlist",allowFrom:[$tg_u]}}
            }' > "$HOME/.openclaw/openclaw.json"

          DOC_OUT=$(openclaw doctor 2>&1 | tail -n 25 || true)
          timeout 12s openclaw gateway run --port 18789 --verbose > /tmp/gw_diag.log 2>&1 || true
          GW_OUT=$(cat /tmp/gw_diag.log | tail -n 30)

          # Send Part 1 to Telegram
          send_tg "🔍 X-RAY REPORT PART 1/2:
          📦 OpenClaw: ${OC_VER}
          🔑 Gemini HTTP: ${GEM_CODE} | OpenRouter HTTP: ${OR_CODE}
          ⚡ LiteLLM Health: ${LITE_HEALTH}
          📄 Build Out: $(cat /tmp/build_out.txt | head -c 300)
          📁 Files: $(ls -m)"

          sleep 2

          # Send Part 2 (Exact Gateway & Doctor Logs) to Telegram
          send_tg "🔍 X-RAY REPORT PART 2/2 (EXACT LOGS):
          --- GATEWAY OUTPUT ---
          $(echo "$GW_OUT" | tail -c 1500)
          --- LITELLM LOG ---
          $(echo "$LITE_LOG" | tail -c 800)"
