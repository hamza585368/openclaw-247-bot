name: OpenClaw 16GB Live Auto-Healer
on:
  push:
  workflow_dispatch:
concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run-16gb-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Boot & Install
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          T=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]'); U=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')
          curl -s -X POST "https://telegram.org{T}/sendMessage" --data-urlencode "chat_id=${U}" --data-urlencode "text=⏳ 16GB Live Auto-Healer Booting... (45s)" >/dev/null || true
          sudo apt-get update -y && sudo apt-get install -y ffmpeg jq curl
          sudo npm config set ignore-scripts false && sudo npm install -g --foreground-scripts openclaw@latest
          pip install --break-system-packages -q 'litellm[proxy]' auto-editor yt-dlp requests
      - name: Configure & Run 24/7 Live Auto-Healer
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          LITELLM_MASTER_KEY: "sk-local-free-pool"
        run: |
          mkdir -p "$HOME/.openclaw/agents/main/agent" workspace/input workspace/output backup_workspace
          cp -rn backup_workspace/* workspace/ 2>/dev/null || true
          [ -f workspace/extra_keys.json ] || echo '{"google":[],"openrouter":[]}' > workspace/extra_keys.json
          python3 -c '
          import json, os
          d = json.load(open("workspace/extra_keys.json"))
          gk = list(dict.fromkeys([k.strip() for k in [os.getenv("GEMINI_KEY","")] + d.get("google",[]) if k.strip()]))
          ok = list(dict.fromkeys([k.strip() for k in [os.getenv("OPENROUTER_KEY","")] + d.get("openrouter",[]) if k.strip()]))
          qk = list(dict.fromkeys([k.strip() for k in [os.getenv("GROQ_KEY","")] if k.strip()]))
          m = [{"model_name":"smart-free-pool","litellm_params":{"model":"openrouter/openrouter/free","api_key":k,"rpm":15}} for k in ok] + [{"model_name":"smart-free-pool","litellm_params":{"model":"groq/llama-3.3-70b-versatile","api_key":k,"rpm":20}} for k in qk] + [{"model_name":"smart-free-pool","litellm_params":{"model":"gemini/gemini-2.5-flash","api_key":k,"rpm":10}} for k in gk]
          json.dump({"general_settings":{"master_key":"sk-local-free-pool"},"model_list":m,"router_settings":{"routing_strategy":"least-busy","num_retries":3,"cooldown_time":60},"litellm_settings":{"drop_params":True,"cache":True,"cache_params":{"type":"local"}}}, open("/tmp/litellm.yaml","w"))
          '
          printf '#!/usr/bin/env bash\nset -e\nP=$(echo "$1"|tr "[:upper:]" "[:lower:]"); K=$(echo -n "$2"|tr -d "[:space:]"); [[ "$P" == "gemini" ]] && P="google"\njq --arg p "$P" --arg k "$K" ".[$p]+=[$k]|.[$p]|=unique" workspace/extra_keys.json > /tmp/e.json && mv /tmp/e.json workspace/extra_keys.json\necho "SUCCESS: $P key added to Auto-Shift Pool!"\n' > workspace/manage_api.sh && chmod +x workspace/manage_api.sh
          printf 'import os,time,glob,subprocess,requests\nT=os.getenv("TG_BOT_TOKEN","").strip(); U=os.getenv("TG_USER_ID","").strip(); GK=os.getenv("GROQ_KEY","").strip(); OK=os.getenv("OPENROUTER_KEY","").strip()\ndef tg(m): requests.post(f"https://telegram.org{T}/sendMessage",data={"chat_id":U,"text":m},timeout=10)\ndef ai_fix(err):\n wf=".github/workflows/openclaw_16gb.yml"\n if not os.path.exists(wf): return False\n code=open(wf).read()\n p=f"Fix this GitHub Actions YAML based on runtime error. Output ONLY valid raw YAML without markdown:\\nERROR:\\n{err}\\nYAML:\\n{code}"\n for u,k,m in [("https://groq.com",GK,"llama-3.3-70b-versatile"),("https://openrouter.ai",OK,"openrouter/free")]:\n  if not k: continue\n  try:\n   r=requests.post(u,headers={"Authorization":f"Bearer {k}"},json={"model":m,"messages":[{"role":"user","content":p}]},timeout=25)\n   if r.status_code==200:\n    fx=r.json()["choices"]["message"]["content"].strip().strip("`")\n    if fx.startswith("yaml\\n"): fx=fx[5:]\n    if "jobs:" in fx and "run-16gb-openclaw:" in fx and fx!=code: open(wf,"w").write(fx+"\\n"); return True\n  except Exception: pass\n return False\nseen=set()\nwhile True:\n time.sleep(30)\n try:\n  if requests.get("http://127.0.0",headers={"Authorization":"Bearer sk-local-free-pool"},timeout=5).status_code!=200:\n   subprocess.Popen("nohup litellm --config /tmp/litellm.yaml --port 4000 --host 127.0.0.1 >/tmp/litellm.log 2>&1 &",shell=True)\n  if os.path.exists("/tmp/openclaw.log"):\n   txt=open("/tmp/openclaw.log",errors="ignore").read()[-4000:]\n   if "Auto-compaction could not recover" in txt and "compact" not in seen:\n    seen.add("compact"); subprocess.run("rm -rf $HOME/.openclaw/agents/main/sessions/*",shell=True); tg("🩺 Session hang auto-fixed! Dobara message bhejein.")\n   for line in txt.splitlines()[-25:]:\n    if any(w in line.lower() for w in ["fatal","unhandled","econnrefused","unauthorized","invalid api key","401","403"]) and line[:60] not in seen:\n     seen.add(line[:60])\n     if ai_fix(txt[-2500:]): tg("🩺 Chhota/Bada error mila—AI ne file khud edit karke fix kar diya! Auto-restarting..."); subprocess.run("git add -A && git commit -m AutoHeal && git push",shell=True); os._exit(0)\n except Exception: pass\n' > workspace/live_healer.py
          printf '# 16GB Live Auto-Healer AI\n- Hinglish mein concise, natural aur helpful reply karo.\n- COST GUARD: Max 4 commands per request.\n- `/api` COMMAND: Jab user `/api` bheje, poochho "Google Gemini ya OpenRouter? Provider aur key bhej dein." Key milte hi `bash workspace/manage_api.sh <provider> <key>` chalao.\n- VIDEO AUTO-DELETE: Video `workspace/input/` mein save karo, `ffmpeg`/`auto-editor` se `workspace/output/` mein render karke bhejo, aur "Done ✅" se pehle `rm -rf workspace/input/* workspace/output/*` chalao.\n' > workspace/SOUL.md
          T=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]'); U=$(echo -n "$TG_USER_ID" | tr -d '[:space:]'); TOK=$(openssl rand -hex 16)
          jq -n '{version:1,profiles:{"litellm:default":{type:"api_key",provider:"litellm",key:"sk-local-free-pool"}}}' > "$HOME/.openclaw/agents/main/agent/auth-profiles.json"
          jq -n --arg tok "$TOK" --arg ws "$PWD/workspace" --arg t "$T" --arg u "$U" --arg o "telegram:${U}" '{gateway:{mode:"local",port:18789,bind:"loopback",auth:{mode:"token",token:$tok}},auth:{profiles:{"litellm:default":{provider:"litellm",mode:"api_key"}}},commands:{ownerAllowFrom:[$o]},memory:{search:{provider:"none"}},models:{providers:{litellm:{baseUrl:"http://127.0.0",apiKey:"sk-local-free-pool",api:"openai-completions",models:[{id:"smart-free-pool",name:"128K Free Pool",reasoning:false,input:["text"],cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:131072,maxTokens:4096}]}}},agents:{defaults:{workspace:$ws,maxConcurrent:2,timeoutSeconds:120,model:{primary:"litellm/smart-free-pool"}}},tools:{exec:{security:"full",ask:"off",timeoutSec:90}},channels:{telegram:{enabled:true,botToken:$t,dmPolicy:"allowlist",allowFrom:[$u]}}}' > "$HOME/.openclaw/openclaw.json"
          openclaw doctor --fix >/dev/null 2>&1 || true
          git config user.name "Bot" && git config user.email "b@o.local"
          git remote set-url origin "https://x-access-token:${GH_PAT}@://github.com{{ github.repository }}.git"
          nohup litellm --config /tmp/litellm.yaml --port 4000 --host 127.0.0.1 >/tmp/litellm.log 2>&1 &
          nohup python3 workspace/live_healer.py >/tmp/healer.log 2>&1 &
          sleep 6
          LH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0 -H "Authorization: Bearer sk-local-free-pool" || echo "000")
          curl -s -X POST "https://telegram.org{T}/sendMessage" --data-urlencode "chat_id=${U}" --data-urlencode "text=🚀 16GB Live Auto-Healer LIVE! LiteLLM: HTTP ${LH} | Har 30s AI Guard ON! Ab 'Hi' bhejein." >/dev/null || true
          ST=$(date +%s)
          timeout 19500s openclaw gateway run --port 18789 --verbose 2>&1 | tee /tmp/openclaw.log || true
          rm -rf workspace/input/* workspace/output/* FULL_DIAGNOSTIC_REPORT.txt 2>/dev/null || true
          cp -r workspace/* backup_workspace/ 2>/dev/null || true
          if [ $(( $(date +%s) - ST )) -lt 300 ]; then
            python3 -c 'import workspace.live_healer as h; txt=open("/tmp/openclaw.log",errors="ignore").read()[-2500:]; h.ai_fix(txt)' || true
            git add -A && ! git diff --staged --quiet && git commit -m "AI Crash Self-Heal" && git push && curl -s -X POST "https://telegram.org{T}/sendMessage" --data-urlencode "chat_id=${U}" --data-urlencode "text=🩺 Crash ko AI ne khud fix karke push kar diya! Restarting..." >/dev/null || true
          else
            git add -A && git diff --staged --quiet || (git commit -m "Sync" && git push)
            curl -s -X POST "https://github.com{{ github.repository }}/actions/workflows/openclaw_16gb.yml/dispatches" -H "Authorization: Bearer ${GH_PAT}" -d '{"ref":"main"}' || true
          fi
