name: OpenClaw 16GB Engine

on:
  push:
  workflow_dispatch:

concurrency:
  group: openclaw-single-instance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-16gb-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fast Install Node 22 & OpenClaw (45 Seconds)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq curl
          sudo npm config set ignore-scripts false
          sudo npm install -g --foreground-scripts openclaw@latest
          pip install -q auto-editor yt-dlp

      - name: Configure Working OpenRouter + Native Groq Auth
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          AGENT_DIR="$HOME/.openclaw/agents/main/agent"
          mkdir -p "$AGENT_DIR" "$HOME/.openclaw/credentials" workspace/input workspace/output
          cp -rn backup_workspace/* workspace/ 2>/dev/null || true
          echo "# 16GB RAM Cloud AI Assistant - Hinglish mein seedha aur fast reply karo." > workspace/SOUL.md

          CLEAN_GROQ=$(echo -n "$GROQ_KEY" | tr -d '[:space:]')
          CLEAN_GEMINI=$(echo -n "$GEMINI_KEY" | tr -d '[:space:]')
          CLEAN_OR=$(echo -n "$OPENROUTER_KEY" | tr -d '[:space:]')
          CLEAN_TG=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]')
          CLEAN_UID=$(echo -n "$TG_USER_ID" | tr -d '[:space:]')
          OR_U=$(echo "aHR0cHM6Ly9vcGVucm91dGVyLmFpL2FwaS92MQ==" | base64 -d)
          TOK=$(openssl rand -hex 16)

          jq -n \
            --arg gq "$CLEAN_GROQ" \
            --arg gm "$CLEAN_GEMINI" \
            --arg or "$CLEAN_OR" \
            '{
              version: 1,
              profiles: {
                "openrouter:default": {type: "api_key", provider: "openrouter", key: $or},
                "groq:default": {type: "api_key", provider: "groq", key: $gq},
                "google:default": {type: "api_key", provider: "google", key: $gm}
              }
            }' > "$AGENT_DIR/auth-profiles.json"

          jq -n \
            --arg tok "$TOK" \
            --arg ws "$PWD/workspace" \
            --arg or_u "$OR_U" --arg or_k "$CLEAN_OR" \
            --arg tg_t "$CLEAN_TG" --arg tg_u "$CLEAN_UID" \
            '{
              gateway: {mode: "local", port: 18789, bind: "loopback", auth: {mode: "token", token: $tok}},
              auth: {
                profiles: {
                  "openrouter:default": {provider: "openrouter", mode: "api_key"},
                  "groq:default": {provider: "groq", mode: "api_key"},
                  "google:default": {provider: "google", mode: "api_key"}
                }
              },
              models: {
                providers: {
                  openrouter: {
                    baseUrl: $or_u,
                    apiKey: $or_k,
                    api: "openai-completions",
                    models: [
                      {id: "openrouter/free", name: "OR Free Auto", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 128000, maxTokens: 8192},
                      {id: "meta-llama/llama-3.3-70b-instruct:free", name: "Llama 3.3 70B Free", reasoning: false, input: ["text"], cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}, contextWindow: 128000, maxTokens: 8192}
                    ]
                  }
                }
              },
              agents: {
                defaults: {
                  workspace: $ws,
                  model: {
                    primary: "openrouter/openrouter/free",
                    fallbacks: [
                      "groq/llama-3.3-70b-versatile",
                      "openrouter/meta-llama/llama-3.3-70b-instruct:free",
                      "google/gemini-2.5-flash"
                    ]
                  }
                }
              },
              tools: {exec: {security: "full", ask: "off"}},
              channels: {telegram: {enabled: true, botToken: $tg_t, dmPolicy: "allowlist", allowFrom: [$tg_u]}}
            }' > "$HOME/.openclaw/openclaw.json"

      - name: Start OpenClaw 16GB Live Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          TG_API=$(echo "aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==" | base64 -d)
          curl -s -X POST "${TG_API}${TG_BOT_TOKEN}/sendMessage" -d "chat_id=${TG_USER_ID}" -d "text=⚡ 45-Sec Fast Server LIVE! Ab '/new' aur 'Hi' bhejein!" >/dev/null || true
          timeout 19500s openclaw gateway run --port 18789 --verbose || true

      - name: Auto-Save Backup & Trigger Next 24/7 Cycle
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p backup_workspace
          cp -r workspace/* backup_workspace/ 2>/dev/null || true
          git config user.name "OpenClaw16GB"
          git config user.email "bot@openclaw.local"
          git add backup_workspace
          git diff --staged --quiet || (git commit -m "Sync 16GB workspace" && git push)
          GH_API=$(echo "aHR0cHM6Ly9hcGkuZ2l0aHViLmNvbS9yZXBvcy8=" | base64 -d)
          curl -s -X POST "${GH_API}${{ github.repository }}/actions/workflows/openclaw_16gb.yml/dispatches" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' || true
